apiVersion: 1

# Datasources based on /home/dev/2-tools/.prometheus/prometheus_cfg.yml
# Prometheus scrapes: postgres_exporter, node-exporter, nvidia-gpu, ollama, traefik, n8n, cadvisor

datasources:
  # Main Prometheus - collects all metrics
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: "15s"

  # PostgreSQL - Direct database access for n8n data queries
  - name: PostgreSQL
    uid: postgresql
    type: postgres
    access: proxy
    url: postgres:5432
    database: n8n
    user: root
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    secureJsonData:
      password: '029466372'
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1400
      timescaledb: false

  # PostgreSQL - QuoteAI application database (logs, jobs, chat_logs, proposals)
  - name: QuoteAI PostgreSQL
    uid: quoteai-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: quoteai_db
    user: quoteai
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    secureJsonData:
      password: 'quoteai'
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1400
      timescaledb: false
