apiVersion: 1

# Datasources based on /home/dev/2-tools/.prometheus/prometheus_cfg.yml
# Prometheus scrapes: postgres_exporter, node-exporter, nvidia-gpu, ollama, traefik, n8n, cadvisor

datasources:
  # Main Prometheus - collects all metrics
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: "15s"

  # PostgreSQL - Direct database access for n8n data queries
  - name: PostgreSQL
    uid: postgresql
    type: postgres
    access: proxy
    url: postgres:5432
    database: n8n
    user: root
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    secureJsonData:
      password: '029466372'
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1400
      timescaledb: false

  # PostgreSQL - QuoteAI application database (logs, jobs, chat_logs, proposals)
  - name: QuoteAI PostgreSQL
    uid: quoteai-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: quoteai_db
    user: quoteai
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    secureJsonData:
      password: 'quoteai'
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1400
      timescaledb: false

  # MySQL - Ivrit transcription service database (jobs, segments, transcripts)
  - name: Ivrit MySQL
    uid: ivrit-mysql
    type: mysql
    access: proxy
    url: ivrit-mysql:3306
    database: ivrit_db
    user: ivrit_user
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    secureJsonData:
      password: 'ivrit_password'
    jsonData:
      maxOpenConns: 5
      maxIdleConns: 2

  # Infinity - JSON REST API polling for services without a DB/Prometheus (FileWizard, Docling)
  - name: Infinity
    uid: infinity
    type: yesoreyeram-infinity-datasource
    access: proxy
    isDefault: false
    version: 1
    editable: true
    jsonData:
      auth_method: none
