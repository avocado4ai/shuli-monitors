apiVersion: 1

groups:
  - orgId: 1
    name: filesystem-usage
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: data-mount-high-usage
        title: "/data usage > 85%"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: eewyj5dtxw3r4a
            model:
              datasource:
                type: prometheus
                uid: eewyj5dtxw3r4a
              editorMode: code
              expr: (1 - node_filesystem_avail_bytes{job="node", mountpoint="/data", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node", mountpoint="/data", fstype!~"tmpfs|overlay"}) * 100
              instant: true
              interval: ""
              intervalFactor: 1
              legendFormat: ""
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "/data usage high on {{ $labels.instance }}"
          description: "/data has been above 85% for over 5 minutes (current {{ printf \"%.1f\" $values.B.Value }}%)."
        labels:
          severity: warning
