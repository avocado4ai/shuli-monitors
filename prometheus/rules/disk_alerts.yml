groups:
  - name: disk_alerts
    rules:
      - alert: DataMountHighUsage
        expr: (1 - node_filesystem_avail_bytes{job="node", mountpoint="/data", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node", mountpoint="/data", fstype!~"tmpfs|overlay"}) * 100 >= 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "/data filesystem usage high ({{ $value | humanize }}%)"
          description: "The /data mount on {{ $labels.instance }} has exceeded 85% usage for more than 5 minutes. Check Docker images, volumes, and build cache to free space."
      - alert: RootMountHighUsage
        expr: (1 - node_filesystem_avail_bytes{job="node", mountpoint="/", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node", mountpoint="/", fstype!~"tmpfs|overlay"}) * 100 >= 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Root filesystem usage high ({{ $value | humanize }}%)"
          description: "The root mount on {{ $labels.instance }} has exceeded 85% usage for more than 5 minutes. This is critical and can cause system instability."
      - alert: DiskWillFillIn4Hours
        expr: predict_linear(node_filesystem_free_bytes{job="node", fstype!~"tmpfs|overlay"}[1h], 4 * 3600) < 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Disk is predicted to fill in 4 hours on {{ $labels.instance }}"
          description: "The disk on {{ $labels.instance }} at mount point {{ $labels.mountpoint }} is critically low and predicted to be full in the next 4 hours."