volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    hostname: prometheus
    networks:
      - n8n_net
      - traefik-public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - prometheus_data:/prometheus
      - ./.prometheus/prometheus_cfg.yml:/etc/prometheus/prometheus_cfg.yml
      - ./.prometheus/rules:/etc/prometheus/rules
    ports:
      - "9098:9090"
    # Note: Prometheus runs on internal port 9090, exposed as 9098 for security
    command:
      - "--config.file=/etc/prometheus/prometheus_cfg.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`prometheus.avocado4ai.com`)
      - traefik.http.routers.prometheus.entrypoints=web,websecure
      - traefik.http.routers.prometheus.tls=true
      - traefik.http.routers.prometheus.tls.certresolver=cloudflare
      - traefik.http.routers.prometheus.service=prometheus
      - traefik.http.routers.prometheus.middlewares= prometheus-auth
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
      - traefik.http.services.prometheus.loadbalancer.server.scheme=http
      - traefik.docker.network=traefik-public

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    hostname: cadvisor
    networks:
      - n8n_net
    ports:
      - "8769:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: always
    command:
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
  # nvidia-gpu-exporter:
  #   image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.8-3.6.0-ubuntu22.04
  #   container_name: nvidia_gpu_exporter
  #   hostname: nvidia_gpu_exporter
  #   networks:
  #     - n8n_net
  #   ports:
  #     - "9080:9400"
  #   cap_add:
  #     - SYS_ADMIN
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   restart: always

  nvidia_gpu_exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: nvidia_gpu_exporter
    hostname: nvidia_gpu_exporter
    network_mode: host # Using host network to match original setup
    volumes:
      - /var/lib/nvidia-docker/volumes/nvidia_driver/latest:/usr/local/nvidia:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: [ "--address=:9835", "--collectors=/etc/dcgm-exporter/default-counters.csv" ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    cap_add:
      - SYS_ADMIN
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    hostname: node_exporter
    networks:
      - n8n_net
      - traefik-public
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.node-exporter.rule=Host(`node-exporter.avocado4ai.com`)"
      - "traefik.http.routers.node-exporter.entrypoints=web"
      - "traefik.http.services.node-exporter.loadbalancer.server.port=9100"
      - "traefik.docker.network=traefik-public"

networks:
  # This network is created/owned by the upper-level compose
  n8n_net:
    external:
      name: n8n_net
  traefik-public:
    external:
      name: traefik-public
